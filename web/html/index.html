<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>Gestão de Estoque</h1>
            <nav>
                <a href="index.html" class="active">Home</a>
                <a href="produtos.html">Produtos</a>
                <a href="fornecedores.html">Fornecedores</a>
                <a href="movimentacoes.html">Movimentações</a>
                <a href="usuarios.html">Usuários</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="dashboard">
            <div class="row">
                <div class="col-md-3">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title">Produtos</h5>
                            <h2 class="card-value" id="total-produtos">0</h2>
                            <a href="produtos.html" class="btn btn-sm btn-primary">Ver Todos</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title">Fornecedores</h5>
                            <h2 class="card-value" id="total-fornecedores">0</h2>
                            <a href="fornecedores.html" class="btn btn-sm btn-primary">Ver Todos</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title">Movimentações</h5>
                            <h2 class="card-value" id="total-movimentacoes">0</h2>
                            <a href="movimentacoes.html" class="btn btn-sm btn-primary">Ver Todas</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-stats">
                        <div class="card-body">
                            <h5 class="card-title">Usuários</h5>
                            <h2 class="card-value" id="total-usuarios">0</h2>
                            <a href="usuarios.html" class="btn btn-sm btn-primary">Ver Todos</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5>Produtos com Baixo Estoque</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table" id="baixo-estoque">
                                    <thead>
                                        <tr>
                                            <th>Produto</th>
                                            <th>Quantidade</th>
                                            <th>Local</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Preenchido por JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5>Últimas Movimentações</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table" id="ultimas-movimentacoes">
                                    <thead>
                                        <tr>
                                            <th>Data</th>
                                            <th>Produto</th>
                                            <th>Tipo</th>
                                            <th>Qtd.</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Preenchido por JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Sistema de Gestão de Estoque &copy; <span id="current-year"></span></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
