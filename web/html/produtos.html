<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/geral.css">
    <style>
        .estoque-baixo {
            color: #dc3545;
            font-weight: bold;
        }
        .estoque-normal {
            color: #28a745;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>Gestão de Produtos</h1>
            <nav>
                <a href="../index.html">Home</a>
                <a href="produtos.html" class="active">Produtos</a>
                <a href="fornecedores.html">Fornecedores</a>
                <a href="movimentacoes.html">Movimentações</a>
                <a href="usuarios.html">Usuários</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="card form-card">
            <div class="card-header">
                <h5 class="mb-0">Cadastrar/Editar Produto</h5>
            </div>
            <div class="card-body">
                <form id="produtoForm">
                    <input type="hidden" id="produtoId">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="nome">Nome do Produto</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="codigoBarras">Código de Barras</label>
                                <input type="text" class="form-control" id="codigoBarras" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea class="form-control" id="descricao" rows="2" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="quantidade">Quantidade em Estoque</label>
                                <input type="number" class="form-control" id="quantidade" min="0" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="localEstoque">Local no Estoque</label>
                                <input type="text" class="form-control" id="localEstoque" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="fornecedorId">Fornecedor</label>
                                <select class="form-control" id="fornecedorId" required>
                                    <option value="">Carregando fornecedores...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <button type="button" class="btn btn-secondary" id="cancelarBtn" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card list-card">
            <div class="card-header">
                <h5 class="mb-0">Lista de Produtos</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>Estoque</th>
                                <th>Local</th>
                                <th>Fornecedor</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="produtosTable">
                            <!-- Dados serão carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Sistema de Gestão de Estoque &copy; <span id="current-year"></span></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/produtos.js"></script>
</body>
</html>
