<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Movimentações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/geral.css">
    <style>
        .tipo-entrada {
            color: #28a745;
            font-weight: bold;
        }
        .tipo-saida {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>Gestão de Movimentações</h1>
            <nav>
                <a href="../index.html">Home</a>
                <a href="produtos.html">Produtos</a>
                <a href="fornecedores.html">Fornecedores</a>
                <a href="movimentacoes.html" class="active">Movimentações</a>
                <a href="usuarios.html">Usuários</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div class="card form-card">
            <div class="card-header">
                <h5 class="mb-0">Registrar Movimentação</h5>
            </div>
            <div class="card-body">
                <form id="movimentacaoForm">
                    <input type="hidden" id="movimentacaoId">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="tipo">Tipo</label>
                                <select class="form-control" id="tipo" required>
                                    <option value="">Selecione...</option>
                                    <option value="ENTRADA">Entrada</option>
                                    <option value="SAIDA">Saída</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="quantidade">Quantidade</label>
                                <input type="number" class="form-control" id="quantidade" min="1" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="produtoId">Produto</label>
                        <select class="form-control" id="produtoId" required>
                            <option value="">Carregando produtos...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="datetime-local" class="form-control" id="data" required>
                    </div>
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <button type="button" class="btn btn-secondary" id="cancelarBtn" style="display: none;">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card list-card">
            <div class="card-header">
                <h5 class="mb-0">Histórico de Movimentações</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Data</th>
                                <th>Produto</th>
                                <th>Tipo</th>
                                <th>Quantidade</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="movimentacoesTable">
                            <!-- Dados serão carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Sistema de Gestão de Estoque &copy; <span id="current-year"></span></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/movimentacoes.js"></script>
</body>
</html>
