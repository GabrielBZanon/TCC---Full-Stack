<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - SmartSupply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SmartSupply</h1>
        <nav>
            <ul>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="movimentacoes.html">Movimentações</a></li>
                <li><a href="#" id="logout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Bem-vindo ao Sistema</h2>
        <div class="dashboard-cards">
            <div class="card" id="cardProdutos">
                <h3>Produtos</h3>
                <p>Carregando...</p>
            </div>
            <div class="card" id="cardFornecedores">
                <h3>Fornecedores</h3>
                <p>Carregando...</p>
            </div>
            <div class="card" id="cardMovimentacoes">
                <h3>Últimas Movimentações</h3>
                <p>Carregando...</p>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Carrega dados do dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Verifica autenticação
                if (!localStorage.getItem('token')) {
                    window.location.href = 'login.html';
                    return;
                }

                // Carrega contagem de produtos
                const produtos = await fetch('/api/produtos', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                }).then(res => res.json());
                document.getElementById('cardProdutos').querySelector('p').textContent = `${produtos.length} cadastrados`;

                // Carrega contagem de fornecedores
                const fornecedores = await fetch('/api/fornecedores', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                }).then(res => res.json());
                document.getElementById('cardFornecedores').querySelector('p').textContent = `${fornecedores.length} cadastrados`;

                // Carrega últimas movimentações
                const movimentacoes = await fetch('/api/movimentacoes', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                }).then(res => res.json());
                const ultimas = movimentacoes.slice(0, 3).map(m => `${m.tipo} ${m.quantidade}x`).join(', ');
                document.getElementById('cardMovimentacoes').querySelector('p').textContent = ultimas || 'Nenhuma movimentação';

            } catch (error) {
                console.error('Erro ao carregar dashboard:', error);
            }
        });

        // Logout
        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
