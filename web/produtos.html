<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos - SmartSupply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SmartSupply</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="movimentacoes.html">Movimentações</a></li>
                <li><a href="#" id="logout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Gestão de Produtos</h2>
        
        <button id="btnNovoProduto">Novo Produto</button>
        
        <div id="modalProduto" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modalTitulo">Novo Produto</h3>
                <form id="formProduto">
                    <input type="hidden" id="produtoId">
                    <div class="form-group">
                        <label for="produtoNome">Nome:</label>
                        <input type="text" id="produtoNome" required>
                    </div>
                    <!-- Outros campos do produto -->
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>

        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão carregados via JavaScript -->
            </tbody>
        </table>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
