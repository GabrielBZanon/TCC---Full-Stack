<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Movimentações - SmartSupply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SmartSupply</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="movimentacoes.html">Movimentações</a></li>
                <li><a href="#" id="logout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Gestão de Movimentações</h2>
        
        <button id="btnNovaMovimentacao">Nova Movimentação</button>
        
        <div id="modalMovimentacao" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modalTitulo">Nova Movimentação</h3>
                <form id="formMovimentacao">
                    <div class="form-group">
                        <label for="movimentacaoTipo">Tipo:</label>
                        <select id="movimentacaoTipo" required>
                            <option value="ENTRADA">Entrada</option>
                            <option value="SAIDA">Saída</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="movimentacaoQuantidade">Quantidade:</label>
                        <input type="number" id="movimentacaoQuantidade" required>
                    </div>
                    <div class="form-group">
                        <label for="movimentacaoProduto">Produto:</label>
                        <select id="movimentacaoProduto" required>
                            <!-- Opções serão carregadas via JS -->
                        </select>
                    </div>
                    <button type="submit">Registrar</button>
                </form>
            </div>
        </div>

        <table id="tabelaMovimentacoes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão carregados via JavaScript -->
            </tbody>
        </table>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/movimentacoes.js"></script>
</body>
</html>
