<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Fornecedores - SmartSupply</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SmartSupply</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="fornecedores.html">Fornecedores</a></li>
                <li><a href="movimentacoes.html">Movimentações</a></li>
                <li><a href="#" id="logout">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Gestão de Fornecedores</h2>
        
        <button id="btnNovoFornecedor">Novo Fornecedor</button>
        
        <div id="modalFornecedor" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modalTitulo">Novo Fornecedor</h3>
                <form id="formFornecedor">
                    <input type="hidden" id="fornecedorId">
                    <div class="form-group">
                        <label for="fornecedorNome">Nome:</label>
                        <input type="text" id="fornecedorNome" required>
                    </div>
                    <div class="form-group">
                        <label for="fornecedorCNPJ">CNPJ:</label>
                        <input type="text" id="fornecedorCNPJ" required>
                    </div>
                    <div class="form-group">
                        <label for="fornecedorContato">Contato:</label>
                        <input type="text" id="fornecedorContato" required>
                    </div>
                    <div class="form-group">
                        <label for="fornecedorEmail">E-mail:</label>
                        <input type="email" id="fornecedorEmail" required>
                    </div>
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>

        <table id="tabelaFornecedores">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CNPJ</th>
                    <th>Contato</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão carregados via JavaScript -->
            </tbody>
        </table>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/fornecedores.js"></script>
</body>
</html>
