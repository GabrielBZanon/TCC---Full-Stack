<!-- pages/produtos.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Produtos</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <h1>Cadastro de Produtos</h1>
  <form onsubmit="event.preventDefault(); cadastrarProduto();">
    <input type="text" id="nome" placeholder="Nome do Produto" required />
    <input type="text" id="categoria" placeholder="Categoria" required />
    <input type="number" id="estoque" placeholder="Estoque Inicial" required />
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Lista de Produtos</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Categoria</th><th>Estoque</th></tr>
    </thead>
    <tbody id="lista-produtos"></tbody>
  </table>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function cadastrarProduto() {
      const nome = document.getElementById("nome").value;
      const categoria = document.getElementById("categoria").value;
      const estoque = parseInt(document.getElementById("estoque").value);
      adicionarItem("produtos", { nome, categoria, estoque });
      document.querySelector("form").reset();
      preencherProdutos();
    }

    function preencherProdutos() {
      const lista = obterDados("produtos");
      const tbody = document.getElementById("lista-produtos");
      tbody.innerHTML = "";
      lista.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.id}</td>
          <td>${p.nome}</td>
          <td>${p.categoria}</td>
          <td>${p.estoque}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    preencherProdutos();
  </script>
</body>
</html>
