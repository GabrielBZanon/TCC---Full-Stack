<!-- pages/usuarios.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Usuários</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <h1>Cadastro de Usuários</h1>
  <form onsubmit="event.preventDefault(); cadastrarUsuario();">
    <input type="text" id="nome" placeholder="Nome do Usuário" required />
    <input type="email" id="email" placeholder="Email" required />
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Lista de Usuários</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Nome</th><th>Email</th></tr>
    </thead>
    <tbody id="lista-usuarios"></tbody>
  </table>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function cadastrarUsuario() {
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      adicionarItem("usuarios", { nome, email });
      document.querySelector("form").reset();
      preencherUsuarios();
    }

    function preencherUsuarios() {
      const lista = obterDados("usuarios");
      const tbody = document.getElementById("lista-usuarios");
      tbody.innerHTML = "";
      lista.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.id}</td>
          <td>${u.nome}</td>
          <td>${u.email}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    preencherUsuarios();
  </script>
</body>
</html>
