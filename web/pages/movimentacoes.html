<!-- pages/movimentacoes.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Movimentações</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <h1>Cadastro de Movimentações</h1>
  <form onsubmit="event.preventDefault(); cadastrarMovimentacao();">
    <select id="produto" required></select>
    <select id="fornecedor" required></select>
    <select id="usuario" required></select>
    <input type="number" id="quantidade" placeholder="Quantidade" required />
    <select id="tipo">
      <option value="entrada">Entrada</option>
      <option value="saida">Saída</option>
    </select>
    <button type="submit">Registrar</button>
  </form>

  <h2>Lista de Movimentações</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Produto</th><th>Fornecedor</th><th>Usuário</th><th>Quantidade</th><th>Tipo</th></tr>
    </thead>
    <tbody id="lista-movimentacoes"></tbody>
  </table>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function preencherSelects() {
      preencherSelect("produto", "produtos", "nome");
      preencherSelect("fornecedor", "fornecedores", "nome");
      preencherSelect("usuario", "usuarios", "nome");
    }

    function cadastrarMovimentacao() {
      const produtoId = parseInt(document.getElementById("produto").value);
      const fornecedorId = parseInt(document.getElementById("fornecedor").value);
      const usuarioId = parseInt(document.getElementById("usuario").value);
      const quantidade = parseInt(document.getElementById("quantidade").value);
      const tipo = document.getElementById("tipo").value;

      adicionarItem("movimentacoes", {
        produtoId,
        fornecedorId,
        usuarioId,
        quantidade,
        tipo
      });

      document.querySelector("form").reset();
      preencherMovimentacoes();
    }

    function preencherMovimentacoes() {
      const movimentacoes = obterDados("movimentacoes");
      const produtos = obterDados("produtos");
      const fornecedores = obterDados("fornecedores");
      const usuarios = obterDados("usuarios");

      const tbody = document.getElementById("lista-movimentacoes");
      tbody.innerHTML = "";

      movimentacoes.forEach(m => {
        const produto = produtos.find(p => p.id === m.produtoId)?.nome || "Desconhecido";
        const fornecedor = fornecedores.find(f => f.id === m.fornecedorId)?.nome || "Desconhecido";
        const usuario = usuarios.find(u => u.id === m.usuarioId)?.nome || "Desconhecido";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.id}</td>
          <td>${produto}</td>
          <td>${fornecedor}</td>
          <td>${usuario}</td>
          <td>${m.quantidade}</td>
          <td>${m.tipo}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    preencherSelects();
    preencherMovimentacoes();
  </script>
</body>
</html>
