<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Supply - Sistema Integrado</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">

                <p class="slogan">Sistema integrado de Almoquifácio</p>
            </div>
            <div class="user-welcome" id="user-welcome">
                <!-- Preenchido dinamicamente -->
            </div>
        </header>

        <nav class="app-nav" id="app-nav">
            <ul>
                <li><a href="#" data-route="dashboard">Dashboard</a></li>

                <li><a href="#" data-route="fornecedores">Fornecedores</a></li>

                <li><a href="#" id="logout-btn">Sair</a></li>
            </ul>
        </nav>

        <main class="app-content" id="app-content">
            <!-- Conteúdo dinâmico será carregado aqui -->
            <div class="loading" id="loading">Carregando...</div>
        </main>
    </div>

    <script src="/js/api.js" type="module"></script>
    <script src="/js/auth.js" type="module"></script>
    <script src="/js/app.js" type="module"></script>
