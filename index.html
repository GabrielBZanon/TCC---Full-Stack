<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando para o Sistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #4eb5ff;
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top: 5px solid #4eb5ff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn {
            display: inline-block;
            background: #4eb5ff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #3a9be3;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .logo {
            font-size: 3rem;
            color: #4eb5ff;
            margin-bottom: 20px;
        }
        
        .countdown {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #4eb5ff;
            font-weight: bold;
        }
        
        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }
        
        .github-info {
            margin-top: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .container {
                padding: 20px;
            }
            
            .links {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-redo-alt"></i>
        </div>
        
        <h1>Redirecionamento para o Sistema</h1>
        
        <p>Você está sendo redirecionado automaticamente para a página principal do sistema.</p>
        
        <div class="loader"></div>
        
        <div class="countdown" id="countdown">Redirecionando em 5 segundos...</div>
        
        <div class="links">
            <a href="dashboard.html" class="btn">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
            <a href="products.html" class="btn">
                <i class="fas fa-box"></i> Produtos
            </a>
            <a href="fornecedores.html" class="btn">
                <i class="fas fa-truck"></i> Fornecedores
            </a>
            <a href="movimentacoes.html" class="btn">
                <i class="fas fa-exchange-alt"></i> Movimentações
            </a>
        </div>
        
        <div class="github-info">
            <p><i class="fab fa-github"></i> GitHub Pages - Se você está vendo esta mensagem, o redirecionamento está funcionando corretamente.</p>
        </div>
    </div>

    <script>
        // Redirecionamento após 5 segundos
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        const countdownInterval = setInterval(() => {
            seconds--;
            countdownElement.textContent = `Redirecionando em ${seconds} segundos...`;
            
            if (seconds <= 0) {
                clearInterval(countdownInterval);
                window.location.href = "dashboard.html";
            }
        }, 1000);
        
        // Redirecionamento imediato se o usuário clicar em qualquer lugar
        document.body.addEventListener('click', function() {
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
